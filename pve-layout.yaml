# hellnet PVE VM layout — fonte para rebuild total das 6 VMs
# PVE host: 192.168.1.254 (root@192.168.1.254), node 'pve', kernel 7.0.12-1-pve
# Storage: local (dir) p/ efidisk0 raw | local-zfs (rpool/data zvol) p/ scsi0
# ISO: /var/lib/vz/template/iso/talos-v1.13.6.iso
# TODAS as VMs: machine=q35, bios=ovmf, scsihw=virtio-scsi-pci, cpu=host, onboot=1

vms:
  cp1:
    vmid: 201
    name: cp1
    role: control-plane
    cores: 4
    memory: 8192
    mac: BC:24:11:F8:89:68
    ip: 192.168.1.201
    ip_static: true
    disk:
      efidisk0: local:201/vm-201-disk-0.raw,efitype=2m,size=528K
      scsi0: local-zfs:vm-201-disk-0,cache=writethrough,discard=on,size=60G,ssd=1
    boot: order=scsi0
    schematic: factory.talos.dev/installer/dc7b152cb3ea99b821fcb7340ce7168313ce393d663740b791c36f6e95fc8586:v1.13.6
    machine_config: cp1-install-vip.yaml

